<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fond carré arrondi vert sauge -->
  <rect width="512" height="512" rx="112" ry="112" fill="#4F6B58"/>

  <!-- Pilule inclinée à 45°, plus grande, bordure blanche, intérieur vert -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Corps de la pilule -->
    <rect x="-110" y="-48" width="220" height="96" rx="48" ry="48"
          fill="#4F6B58" stroke="#FBF6EE" stroke-width="12"/>
    <!-- Ligne de séparation blanche -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#FBF6EE" stroke-width="12"/>
  </g>
</svg>
